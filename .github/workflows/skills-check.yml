name: skills-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify vendored skills match the lockfile digests (offline)
        run: python3 scripts/vendor/skill_vendor.py check --offline
      - name: Verify lockfile pins still match upstream refs and content
        run: python3 scripts/vendor/skill_vendor.py check
      - name: Run unit tests (state machine / gate matrix / hooks / parity)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerate skills must be a no-op (parity)
        run: |
          python3 scripts/generate_skills.py
          git diff --exit-code skills/
      - name: Reject direct edits to externally managed skills
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          CHANGED="$changed" python3 - <<'PY'
          import json, os, sys

          changed = {line for line in os.environ["CHANGED"].splitlines() if line}
          if "skills.lock.json" in changed:
              raise SystemExit(0)
          lock = json.load(open("skills.lock.json", encoding="utf-8"))
          prefixes = {
              f"{source['dest'].rstrip('/')}/{name}/"
              for source in lock["sources"]
              for name in source["skills"]
          }
          bypassed = sorted(p for p in changed if any(p.startswith(prefix) for prefix in prefixes))
          if bypassed:
              print("::error::Externally managed skills changed without skills.lock.json: " + ", ".join(bypassed))
              sys.exit(1)
          PY
